name: Verify live Cloudflare Hub

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: Public HTTPS, deployment and security response headers
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Verify public live Hub over HTTPS
        run: node scripts/verify-hub-live.mjs
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
