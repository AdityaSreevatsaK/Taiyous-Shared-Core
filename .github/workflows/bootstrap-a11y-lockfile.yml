# Temporary one-time workflow: commit the REAL npm lockfile after adding axe tests.
name: Bootstrap accessibility test lockfile (one-time)
on:
  push:
    branches: [feat/hub-accessible-navigation-20261118]
    paths:
      - .github/workflows/bootstrap-a11y-lockfile.yml
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Resolve updated dev dependency and lockfile
        run: npm install --no-audit --no-fund
      - name: Verify clean install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit only package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile unchanged"
            exit 0
          fi
          git commit -m "chore(build): lock accessibility test dependency on Node 22"
          git push origin HEAD:refs/heads/feat/hub-accessible-navigation-20261118
