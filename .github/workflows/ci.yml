name: Verify Shared Core and Hub

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build and unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Audit production dependencies for high/critical advisories
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --omit=dev --audit-level=high

  browser:
    name: Browser (${{ matrix.browser }}) responsive, keyboard and WCAG A/AA tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium and system libraries
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build local workspace libraries for the browser suite
        run: |
          npm run build -w @taiyou/contracts
          npm run build -w @taiyou/ui
      - name: Hub browser tests for the selected engine only
        run: npm run test:browser -w @taiyou/hub -- --project=${{ matrix.browser }}
      - name: Upload visual-review screenshots
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hub-visual-review-${{ matrix.browser }}
          path: apps/hub/test-results/**/hub-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-${{ matrix.browser }}
          path: |
            apps/hub/playwright-report/
            apps/hub/test-results/
          if-no-files-found: ignore
          retention-days: 7
