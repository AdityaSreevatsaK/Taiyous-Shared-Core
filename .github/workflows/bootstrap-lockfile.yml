# Temporary: generate the REAL npm workspace lockfile in a trusted hosted runner.
# This file must be removed after the lockfile lands.
name: Bootstrap Node 22 lockfile (one-time)
on:
  push:
    branches:
      - feat/hub-accessible-navigation-20261118
    paths:
      - .github/workflows/bootstrap-lockfile.yml
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate real npm lockfile
        run: npm install --no-audit --no-fund
      - name: Verify clean install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: generated-workspace-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
      - name: Commit generated lockfile to this feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches the branch"
            exit 0
          fi
          git commit -m "chore(build): commit real Node 22 npm workspace lockfile"
          git push origin HEAD:refs/heads/feat/hub-accessible-navigation-20261118
